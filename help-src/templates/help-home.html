<!DOCTYPE html>
<html lang="$html_lang">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="$description" />
  <title>$title — Vivarcus</title>
  <link rel="canonical" href="$canonical_url" />
  <link rel="alternate" hreflang="$other_lang_code" href="$alternate_url" />
  <link rel="alternate" hreflang="$self_lang_code" href="$canonical_url" />
  <link rel="alternate" hreflang="x-default" href="$x_default_url" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vivarcus" />
  <meta property="og:url" content="$canonical_url" />
  <meta property="og:title" content="$title — Vivarcus" />
  <meta property="og:description" content="$description" />
  <meta property="og:locale" content="$og_locale" />
  <meta property="og:image" content="$base_url/assets/og-image.png" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "$title",
    "url": "$canonical_url",
    "inLanguage": "$self_lang_code",
    "isPartOf": {"@type": "WebSite", "name": "Vivarcus", "url": "$base_url/"}
  }
  </script>
  <link rel="icon" type="image/svg+xml" href="$asset_rel/assets/favicon.svg" />
  <link rel="stylesheet" href="$asset_rel/css/icons.css" />
  <link rel="stylesheet" href="$asset_rel/css/style.css" />
  <link rel="stylesheet" href="$asset_rel/css/help.css" />
</head>
<body class="help-page">
  $header_html

  <main class="help-main help-main--home">
    <section class="help-home-hero">
      <h1>$ui_help_center</h1>
      <p>$home_description</p>
      <div class="help-search-wrap">
        <input type="search" class="help-search" placeholder="$ui_search_placeholder" aria-label="$ui_search_placeholder" />
        <div class="help-search-results" hidden></div>
      </div>
    </section>

    <section class="help-app-cards" aria-label="$ui_apps">
      $app_cards
    </section>

    <section class="help-faq">
      <h2>$ui_faq</h2>
      $faq_html
    </section>
  </main>

  $footer_html
  <script src="$asset_rel/js/help.js"></script>
</body>
</html>
