<!DOCTYPE html>
<html lang="$html_lang">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="$description" />
  <title>$title — $app_name — Vivarcus</title>
  <link rel="canonical" href="$canonical_url" />
  <link rel="alternate" hreflang="$other_lang_code" href="$alternate_url" />
  <link rel="alternate" hreflang="$self_lang_code" href="$canonical_url" />
  <link rel="alternate" hreflang="x-default" href="$x_default_url" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Vivarcus" />
  <meta property="og:url" content="$canonical_url" />
  <meta property="og:title" content="$title — Vivarcus" />
  <meta property="og:description" content="$description" />
  <meta property="og:locale" content="$og_locale" />
  <meta property="og:image" content="$base_url/assets/og-image.png" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "$title",
    "description": "$description",
    "inLanguage": "$self_lang_code",
    "dateModified": "$last_updated",
    "mainEntityOfPage": "$canonical_url",
    "publisher": {"@type": "Organization", "name": "Vivarcus", "url": "$base_url/"}
  }
  </script>
  <link rel="icon" type="image/svg+xml" href="$asset_rel/assets/favicon.svg" />
  <link rel="stylesheet" href="$asset_rel/css/icons.css" />
  <link rel="stylesheet" href="$asset_rel/css/style.css" />
  <link rel="stylesheet" href="$asset_rel/css/help.css" />
</head>
<body class="help-page help-page--article">
  $header_html

  <div class="help-layout">
    <button class="help-sidebar-toggle" aria-expanded="false" aria-controls="help-sidebar">☰</button>
    <aside class="help-sidebar" id="help-sidebar">
      $sidebar_html
    </aside>

    <main class="help-main help-main--article">
      <nav class="help-breadcrumbs" aria-label="breadcrumb">
        <a href="$help_home_rel">$ui_help_center</a>
        <span class="help-breadcrumbs__sep">/</span>
        <a href="$app_index_rel">$app_name</a>
        <span class="help-breadcrumbs__sep">/</span>
        <span>$title</span>
      </nav>

      <article class="help-article">
        <h1>$title</h1>
        <p class="help-article__meta">$ui_updated_on $last_updated</p>
        <div class="help-article__body">
          $content_html
        </div>
      </article>

      $related_html
    </main>

    <aside class="help-toc" aria-label="$ui_on_this_page">
      <p class="help-toc__title">$ui_on_this_page</p>
      <nav class="help-toc__nav">
        $toc_html
      </nav>
    </aside>
  </div>

  $footer_html
  <script src="$asset_rel/js/help.js"></script>
  <script src="$asset_rel/js/tracking.js"></script>
</body>
</html>
